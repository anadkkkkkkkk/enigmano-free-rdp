name: EnigMano RDP
on:
  push:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number'
        required: true
        default: '1'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Setup RDP
      run: |
        net user myuser MyNewPass123! /add
        net localgroup administrators myuser /add
        ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 a.pinggy.io
        while ($true) { Start-Sleep -Seconds 600 }

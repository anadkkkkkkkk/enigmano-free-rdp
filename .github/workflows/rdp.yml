name: RDP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Install ngrok
      run: winget install ngrok.ngrok
    - name: Start RDP
      run: |
        $env:Path += ";C:\Users\runneradmin\AppData\Local\ngrok"
        ngrok authtoken ${{ secrets.NGROK_SHAHZAIB }}
        net user myuser MyNewPass123! /add
        net localgroup administrators myuser /add
        ngrok tcp 3389
    - name: Keep Alive
      run: while ($true) { Start-Sleep -Seconds 60 }

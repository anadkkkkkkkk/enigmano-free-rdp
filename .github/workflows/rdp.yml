name: RDP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Start RDP via Pinggy
      run: |
        net user myuser MyNewPass123! /add
        net localgroup administrators myuser /add
        curl -sSL -o pinggy.exe https://pinggy.io/pinggy_windows_amd64.exe
        .\pinggy.exe -p 3389 -s

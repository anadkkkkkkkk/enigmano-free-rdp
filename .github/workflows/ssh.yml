name: SSH Server (No Card, 6 Hours)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable SSH Server
      run: |
        net user sshuser SshPass123! /add
        net localgroup administrators sshuser /add
        Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
        Start-Service sshd
        Set-Service -Name sshd -StartupType 'Automatic'
        New-NetFirewallRule -DisplayName 'Allow SSH' -Direction Inbound -Protocol TCP -LocalPort 22 -Action Allow
    - name: Tunnel SSH via Pinggy (No Card)
      run: |
        ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:22 a.pinggy.io
        while ($true) { Start-Sleep -Seconds 600 }
